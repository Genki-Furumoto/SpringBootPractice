<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>お問い合わせの詳細画面</title>
</head>
<body>
	<h1>お問い合わせの詳細画面</h1>
	  <table border="1">
		<tr>
		  <td>お問い合わせID</td>
		  <td>
		    <span th:text="${id}"></span>
		  </td>
		</tr>
	    <tr>
	      <td>姓</td>
	      <td>
	        <span th:text="${contactById.lastName}"></span>
	      </td>
	    </tr>
	    <tr>
	      <td>名</td>
	      <td>
	        <span th:text="${contactById.firstName}"></span>
	      </td>
	    </tr>
	    <tr>
	      <td>メールアドレス</td>
	      <td>
	        <span th:text="${contactById.email}"></span>
	      </td>
	    </tr>
	    <tr>
	      <td>電話番号</td>
	      <td>
	        <span th:text="${contactById.phone}"></span>
	      </td>
	    </tr>
		<tr>
		  <td>郵便番号</td>
		  <td>
		    <span th:text="${contactById.zipCode}"></span>
		  </td>
		</tr>
		<tr>
		  <td>住所</td>
		  <td>
		    <span th:text="${contactById.address}"></span>
		  </td>
		</tr>
		<tr>
		  <td>建物名</td>
		  <td>
		    <span th:text="${contactById.buildingName}"></span>
		  </td>
		</tr>
		<tr>
		  <td>お問い合わせ種別</td>
		  <td>
		    <span th:text="${contactById.contactType}"></span>
		  </td>
		</tr>
		<tr>
		  <td>内容</td>
		  <td>
		    <span th:text="${contactById.body}"></span>
		  </td>
		</tr>
		<tr>
		  <td>作成日時</td>
		  <td>
			<span th:text="${#temporals.format(contactById.updateAt, 'yyyy/MM/dd HH:mm')}"></span>
		  </td>
		</tr>
		<tr>
		  <td>更新日時</td>
		  <td>
			<span th:text="${#temporals.format(contactById.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
		  </td>
		</tr>
		
	  </table>
	<!--   detail_dashboard.htmlのレンダリングには、getContactByIdで取得された、ModelオブジェクトのcontacrtById属性が読み込まれている。  -->
	<!--   だからcontactByIdではidは一つに定まっているため、これ以降はcontactById.idで指定ができる。-->
	 <form th:action="@{/admin/contacts/{id}/edit(id=${contactById.id})}" medhod="get">
  	  <button type="submit">編集</button>
    </form>
	<form th:action="@{/admin/contacts/signout}" method="get">
		<button type="submit">ログアウト</button>
	</form>
</body>
</html>
