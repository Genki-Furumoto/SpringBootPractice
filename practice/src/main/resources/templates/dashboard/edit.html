<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>お問い合わせの編集画面</title>
</head>
<body>
	<h1>お問い合わせの編集画面</h1>
	<form th:action="@{/admin/contacts/{id}/edit(id=${contactById.id})}" method="post">
	  <table border="1">
	    <tr>
	      <td>姓</td>
	      <td>
	        <input type="text" th:value="${contactById.lastName}" name="lastName"/>
	      </td>
	    </tr>
	    <tr>
	      <td>名</td>
	      <td>
	        <input type="text" th:value="${contactById.firstName}" name="firstName" />
	      </td>
	    </tr>
	    <tr>
	      <td>メールアドレス</td>
	      <td>
	        <input type="text" th:value="${contactById.email}" name="email" />
	      </td>
	    </tr>
	    <tr>
	      <td>電話番号</td>
	      <td>
	        <input type="text" th:value="${contactById.phone}" name="phone" />
	      </td>
	    </tr>
		<tr>
		  <td>郵便番号</td>
		  <td>
		    <input type="text" th:value="${contactById.zipCode}" name="zipCode" />
		  </td>
		</tr>
		<tr>
		  <td>住所</td>
		  <td>
		    <input type="text" th:value="${contactById.address}" name="address" />
		  </td>
		</tr>
		<tr>
		  <td>建物名</td>
		  <td>
		    <input type="text" th:value="${contactById.buildingName}" name="buildingName" />
		  </td>
		</tr>
		<tr>
		  <td>お問い合わせ種別</td>
		  <td>
		  	<select th:value="${contactById.contactType}" name="contactType">
				<option value="サービスに関するお問い合わせ">サービスに関するお問い合わせ</option>
				<option value="技術的なお問い合わせ">技術的なお問い合わせ</option>
				<option value="その他">その他</option>
			</select>
		  </td>
		</tr>
		<tr>
		  <td>内容</td>
		  <td>
		    <input type="text" th:value="${contactById.body}" name="body" />
		  </td>
		</tr>
	  </table>
	  <button type="submit">確認</button>
	</form> 
	<form th:action="@{/admin/contacts/{id}/edit/delete(id=${contactById.id})}" method="get">
		<button type="submit">削除</button>
	</form>
	<form th:action="@{/admin/contacts/signout}" method="get">
		<button type="submit">ログアウト</button>
	</form>
</body>
</html>
